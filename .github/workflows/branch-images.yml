name: Branch images

on:
  push:
    branches:
      - "**"
    tags:
      - "v*-provider*"
  workflow_dispatch:

concurrency:
  group: branch-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            dockerfile: deploy/core/Dockerfile
            paths: >-
              src/ package.json package-lock.json tsconfig.json
              cli/templates/slack-manifest.json skills-seed/
              plugins/onboarding/ plugins/chassis/ .husky/install.mjs
          - name: web-ui
            dockerfile: deploy/web-ui/Dockerfile
            paths: >-
              plugins/web-ui/ plugins/chassis/src/
              plugins/admin/src/ plugins/admin/public/
          - name: admin
            dockerfile: deploy/admin/Dockerfile
            paths: plugins/admin/ plugins/chassis/src/
          - name: portal
            dockerfile: deploy/portal/Dockerfile
            paths: plugins/portal/ plugins/auth/src/ plugins/chassis/src/
          - name: auth
            dockerfile: deploy/auth/Dockerfile
            paths: plugins/auth/ plugins/chassis/src/
          - name: egress-proxy
            dockerfile: deploy/egress-proxy/Dockerfile
            paths: >-
              src/ package.json package-lock.json tsconfig.json
              deploy/egress-proxy/
          - name: sandbox-base
            dockerfile: fly/Dockerfile
            build-args: INSTALL_BROWSER_ENGINE=1
            paths: fly/
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Derive branch tag
        run: |
          tag=$(printf '%s' "${GITHUB_REF_NAME,,}" | sed -E 's/[^a-z0-9_.-]/-/g; s/^-+|-+$//g' | cut -c1-60)
          [ -z "$tag" ] && tag="${GITHUB_SHA:0:12}"
          [ "$tag" = latest ] && tag="latest-branch"
          echo "BRANCH_TAG=$tag" >> "$GITHUB_ENV"
      - name: Find previous provider tag
        if: github.ref_type == 'tag'
        run: |
          prev=$(git for-each-ref refs/tags --sort=-creatordate --format '%(refname:short)' \
            | grep -E '^v[0-9][^ ]*-provider' | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          echo "PREV_TAG=$prev" >> "$GITHUB_ENV"
      - name: Detect component changes
        if: github.ref_type == 'tag' && env.PREV_TAG != ''
        run: |
          if git diff --name-only "$PREV_TAG" HEAD -- ${{ matrix.paths }} | grep -q .; then
            echo "COMPONENT_CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "COMPONENT_CHANGED=false" >> "$GITHUB_ENV"
          fi
      - name: Check previous image exists
        if: github.ref_type == 'tag' && env.PREV_TAG != '' && env.COMPONENT_CHANGED == 'false'
        run: |
          if docker buildx imagetools inspect "ghcr.io/msklv/qm/${{ matrix.name }}:${{ env.PREV_TAG }}" >/dev/null 2>&1; then
            echo "PREV_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "PREV_EXISTS=false" >> "$GITHUB_ENV"
          fi
      - name: Build and push
        if: >-
          github.ref_type != 'tag' ||
          env.PREV_TAG == '' ||
          env.COMPONENT_CHANGED != 'false' ||
          env.PREV_EXISTS != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          provenance: false
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ghcr.io/msklv/qm/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/msklv/qm/${{ matrix.name }}:${{ env.BRANCH_TAG }}
          cache-from: type=gha,scope=qm-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=qm-${{ matrix.name }}
      - name: Re-tag unchanged component from previous tag
        if: >-
          github.ref_type == 'tag' && env.PREV_TAG != '' &&
          env.COMPONENT_CHANGED == 'false' && env.PREV_EXISTS == 'true'
        run: >
          docker buildx imagetools create
          -t ghcr.io/msklv/qm/${{ matrix.name }}:${{ github.sha }}
          -t ghcr.io/msklv/qm/${{ matrix.name }}:${{ env.BRANCH_TAG }}
          ghcr.io/msklv/qm/${{ matrix.name }}:${{ env.PREV_TAG }}
      - name: Tag latest on main
        if: github.ref == 'refs/heads/main'
        run: docker buildx imagetools create -t ghcr.io/msklv/qm/${{ matrix.name }}:latest ghcr.io/msklv/qm/${{ matrix.name }}:${{ github.sha }}