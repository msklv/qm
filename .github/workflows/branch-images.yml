name: Branch images

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: branch-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            dockerfile: deploy/core/Dockerfile
          - name: web-ui
            dockerfile: deploy/web-ui/Dockerfile
          - name: admin
            dockerfile: deploy/admin/Dockerfile
          - name: portal
            dockerfile: deploy/portal/Dockerfile
          - name: auth
            dockerfile: deploy/auth/Dockerfile
          - name: egress-proxy
            dockerfile: deploy/egress-proxy/Dockerfile
          - name: sandbox-base
            dockerfile: fly/Dockerfile
            build-args: INSTALL_BROWSER_ENGINE=1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Derive branch tag
        run: |
          tag=$(printf '%s' "${GITHUB_REF_NAME,,}" | sed -E 's/[^a-z0-9_.-]/-/g; s/^-+|-+$//g' | cut -c1-60)
          [ -z "$tag" ] && tag="${GITHUB_SHA:0:12}"
          [ "$tag" = latest ] && tag="latest-branch"
          echo "BRANCH_TAG=$tag" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          provenance: false
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ghcr.io/msklv/qm/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/msklv/qm/${{ matrix.name }}:${{ env.BRANCH_TAG }}
          cache-from: type=gha,scope=qm-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=qm-${{ matrix.name }}
      - name: Tag latest on main
        if: github.ref == 'refs/heads/main'
        run: docker buildx imagetools create -t ghcr.io/msklv/qm/${{ matrix.name }}:latest ghcr.io/msklv/qm/${{ matrix.name }}:${{ github.sha }}
